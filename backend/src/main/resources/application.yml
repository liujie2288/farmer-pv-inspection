spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      enum-scan-package: com.yldlxj.pv.inspect
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:pv-inspection-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 7200000
  cookie-secure: ${JWT_COOKIE_SECURE:true}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:pv-inspection}

logging:
  level:
    com.pv.inspection: DEBUG
