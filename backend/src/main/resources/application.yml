spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/pv_inspection?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      enum-scan-package: com.yldlxj.pv.inspect
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 28090
  servlet:
    context-path: /
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET:yldl-pv-inspection-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-0501}
  expiration: 5400000
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  refresh-expiration-days: 7

aliyun:
  oss:
    enabled: true
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-chengdu.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_OSS_BUCKET:pv-inspection-test}

logging:
  level:
    com.yldlxj.pv.inspect: DEBUG

playwright:
  enabled: true
